<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio 414</title>
  <script>
    // Style switcher (switcher.js): applies the chosen font and colour before first
    // paint, from ?font=&color= in the URL (which wins) or else from localStorage.
    (function () {
      var params = new URLSearchParams(location.search);
      // max is the number of the last option: 20 for the font and for the colour.
      function pick(name, max) {
        var value = params.get(name);
        if (value === null) {
          try { value = localStorage.getItem('studio414.style.' + name); } catch (e) { value = null; }
        }
        value = String(value).trim();
        return /^(0|[1-9][0-9]?)$/.test(value) && Number(value) <= max ? value : '0';
      }
      document.documentElement.setAttribute('data-font', pick('font', 20));
      document.documentElement.setAttribute('data-color', pick('color', 20));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 800 is only for the big 414; Google serves all three upright weights from one file. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,800;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="boxes.css">
  <link rel="stylesheet" href="comments.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="switcher.css">
  <link rel="stylesheet" href="workshop.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="opening-soon.css">
</head>
<body>
  <main class="hero">
    <!-- "Opening soon": a line of plain italic text in the top-left corner, the
         counterpart of the Workshops button at the top right (opening-soon.css). It
         lies under the 414 and the windows, so it never covers them. -->
    <p class="opening-soon">Opening soon!</p>

    <!-- The studio's name: a giant 414 above the photo, in the page colour (styles.css).
         The heading reads "Studio 414" to screen readers. The box round it is what
         moves: boxes.js lets visitors drag it, and adds a "Move 414" button for the
         keyboard beside the heading, not in it. -->
    <div class="big-414" id="big-414">
      <h1 class="big-414__name"><span class="visually-hidden">Studio </span>414</h1>
    </div>

    <!-- The two boxes are 90s-style windows (boxes.css); boxes.js adds a drag handle
         to each title bar and a resize grip. The style switcher (switcher.js) adds a
         third window. The card sits across the photo's bottom edge (styles.css). -->
    <form class="signup box" id="signup" aria-labelledby="signup-title" novalidate>
      <div class="box__titlebar">
        <svg class="box__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" fill-rule="evenodd" d="M1 3h14v10H1zM2 4v8h12V4zM2 4h1v1H2zM3 5h1v1H3zM4 6h1v1H4zM5 7h1v1H5zM6 8h1v1H6zM7 9h2v1H7zM9 8h1v1H9zM10 7h1v1h-1zM11 6h1v1h-1zM12 5h1v1h-1zM13 4h1v1h-1z"/></svg>
        <span class="box__title" id="signup-title">Mailing list</span>
      </div>
      <div class="signup__body">
        <label class="signup__label" for="email">Join the mailing list</label>
        <div class="signup__row">
          <input class="signup__input" id="email" name="email" type="email"
                 placeholder="you@example.com" autocomplete="email" required>
          <button class="signup__button" type="submit">Sign up</button>
        </div>
        <p class="signup__message" id="signup-message" role="status" aria-live="polite"></p>
        <a class="signup__email" href="mailto:plazastudioceramique@gmail.com">Or email us at plazastudioceramique@gmail.com.</a>
      </div>
    </form>
  </main>

  <section class="comments" id="comments" aria-labelledby="comments-title">
    <div class="comments__inner box" id="comments-box">
      <div class="box__titlebar">
        <svg class="box__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M2 2h12v1H2zM1 3h1v7H1zM14 3h1v7h-1zM2 10h12v1H2zM3 11h1v3H3zM4 12h1v1H4zM5 11h1v1H5zM4 5h8v1H4zM4 7h6v1H4z"/></svg>
        <h2 class="box__title" id="comments-title">Comments</h2>
      </div>
      <div class="comments__body">
        <p class="comments__note" id="comments-note" hidden></p>

        <!-- The comments scroll in here; focusable so the keyboard can scroll it too. -->
        <div class="comments__pane" tabindex="0" role="region" aria-label="Comment list">
          <ol class="comments__list" id="comments-list" hidden></ol>
          <div class="comments__state">
            <p class="comments__status" id="comments-status" role="status" aria-live="polite"></p>
            <button class="comments__link" id="comments-retry" type="button" hidden>Try again</button>
          </div>
        </div>

        <form class="comments__form" id="comments-form" novalidate>
          <div class="comments__field" id="comments-name-field">
            <label class="comments__label" for="comments-name">Your name</label>
            <input class="comments__input" id="comments-name" name="name" type="text"
                   maxlength="40" autocomplete="nickname" autocapitalize="words" spellcheck="false" required>
          </div>
          <p class="comments__identity" id="comments-identity" hidden>
            Commenting as <span class="comments__identity-name" id="comments-identity-name"></span>
            <button class="comments__link" id="comments-change" type="button" aria-label="Change your name">change</button>
          </p>
          <div class="comments__field">
            <label class="comments__label" for="comments-body">Comment</label>
            <textarea class="comments__textarea" id="comments-body" name="body" rows="3" required></textarea>
          </div>
          <div class="comments__actions">
            <button class="comments__submit" id="comments-submit" type="submit">Post comment</button>
            <p class="comments__message" id="comments-message" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Workshops (workshop.js, workshop.css): a raised grey "WORKSHOPS" button like "Sign
       up", fixed at the top right, that opens the Workshops window, a month calendar of
       the workshops coming up with a link to each under it; each one opens its own
       sign-up window. Both are modal 90s dialogs like the boxes. The button stays hidden
       until workshop.js runs, as it does nothing without it, and again once no workshops
       are left. -->
  <button class="workshop-button" id="workshop-button" type="button"
          aria-label="Workshops" aria-haspopup="dialog" aria-controls="workshops" hidden>
    <span class="workshop-button__label" id="workshop-button-label">Workshops</span>
  </button>

  <!-- The Workshops window: the month calendar (calendar.js, calendar.css), starting on
       the month of the next workshop, with each workshop's day marked; a marked day
       opens its sign-up window. calendar.js shows it and draws the month
       (#calendar-days) each time the window opens. Under it, workshop.js fills the list
       (#workshops-list): one plain blue link per workshop coming up, its name and date
       ("Paint a piece, Sat 7 Nov"), then, once they are in, its spots left. -->
  <dialog class="workshop workshop--list box" id="workshops" aria-labelledby="workshops-title">
    <div class="box__titlebar">
      <svg class="box__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M13 1h2v1h-2zM12 2h2v1h-2zM11 3h2v1h-2zM10 4h2v1h-2zM9 5h2v1H9zM7 6h4v1H7zM6 7h4v1H6zM4 9h4v1H4zM3 10h4v1H3zM2 11h4v1H2zM1 12h4v1H1zM1 13h3v1H1zM1 14h2v1H1zM10 13h5v2h-5z"/></svg>
      <h2 class="box__title" id="workshops-title">Workshops</h2>
      <button class="workshop__close" id="workshops-close" type="button" aria-label="Close">
        <svg viewBox="0 0 8 7" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h2v1H0zM6 0h2v1H6zM1 1h2v1H1zM5 1h2v1H5zM2 2h4v1H2zM3 3h2v1H3zM2 4h4v1H2zM1 5h2v1H1zM5 5h2v1H5zM0 6h2v1H0zM6 6h2v1H6z"/></svg>
      </button>
    </div>
    <div class="workshop__body" id="workshops-body">
      <div class="calendar" id="workshops-calendar" hidden>
        <div class="calendar__head">
          <button class="calendar__step" id="calendar-prev" type="button" aria-label="Previous month">
            <svg viewBox="0 0 4 7" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h1v1H3zM2 1h1v1H2zM1 2h1v1H1zM0 3h1v1H0zM1 4h1v1H1zM2 5h1v1H2zM3 6h1v1H3z"/></svg>
          </button>
          <h3 class="calendar__month" id="calendar-month" aria-live="polite"></h3>
          <button class="calendar__step" id="calendar-next" type="button" aria-label="Next month">
            <svg viewBox="0 0 4 7" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h1v1H0zM1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM2 4h1v1H2zM1 5h1v1H1zM0 6h1v1H0z"/></svg>
          </button>
        </div>

        <table class="calendar__grid" aria-labelledby="calendar-month">
          <thead><tr id="calendar-weekdays"></tr></thead>
          <tbody id="calendar-days"></tbody>
        </table>
      </div>

      <ul class="workshop__list" id="workshops-list"></ul>
    </div>
  </dialog>

  <!-- A workshop's sign-up window: workshop.js fills in the workshop (its name, date
       and price), names the dialog after it ("Paint a piece sign-up"), and once the
       spots are in, the title bar says how many are left, counting down to them.
       Screen readers hear the count once, from #workshop-count. -->
  <dialog class="workshop box" id="workshop" aria-label="Workshop sign-up">
    <div class="box__titlebar">
      <svg class="box__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M13 1h2v1h-2zM12 2h2v1h-2zM11 3h2v1h-2zM10 4h2v1h-2zM9 5h2v1H9zM7 6h4v1H7zM6 7h4v1H6zM4 9h4v1H4zM3 10h4v1H3zM2 11h4v1H2zM1 12h4v1H1zM1 13h3v1H1zM1 14h2v1H1zM10 13h5v2h-5z"/></svg>
      <h2 class="box__title" id="workshop-title">Workshop sign-up</h2>
      <button class="workshop__close" id="workshop-close" type="button" aria-label="Close">
        <svg viewBox="0 0 8 7" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h2v1H0zM6 0h2v1H6zM1 1h2v1H1zM5 1h2v1H5zM2 2h4v1H2zM3 3h2v1H3zM2 4h4v1H2zM1 5h2v1H1zM5 5h2v1H5zM0 6h2v1H0zM6 6h2v1H6z"/></svg>
      </button>
    </div>
    <div class="workshop__body">
      <!-- Back to the Workshops window. -->
      <button class="workshop__back" id="workshop-back" type="button">
        <svg viewBox="0 0 4 7" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h1v1H3zM2 1h1v1H2zM1 2h1v1H1zM0 3h1v1H0zM1 4h1v1H1zM2 5h1v1H2zM3 6h1v1H3z"/></svg>
        All workshops
      </button>

      <!-- After Stripe: "You're in!" or "Payment cancelled" (workshop.js). It shows in
           the Workshops window instead when it isn't known which workshop it was. -->
      <div class="workshop__result" id="workshop-result" hidden>
        <svg class="workshop__result-icon" id="workshop-result-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" shape-rendering="crispEdges"></svg>
        <div>
          <p class="workshop__result-title" id="workshop-result-title"></p>
          <p class="workshop__result-text" id="workshop-result-text"></p>
        </div>
      </div>

      <p class="workshop__name" id="workshop-name"></p>
      <dl class="workshop__facts">
        <dt>Date</dt>
        <dd><time id="workshop-date"></time></dd>
        <dt>Price</dt>
        <!-- The price per spot, then "× 1" and − / + for how many spots (1 to the
             spots left, or to 10 until they are in). The total is on the pay button. -->
        <dd class="workshop__price">
          <span id="workshop-price"></span>
          <span class="workshop__quantity" role="group" aria-label="Number of spots">
            <output class="workshop__times" id="workshop-quantity"><span aria-hidden="true">× </span><span id="workshop-quantity-number">1</span><span class="visually-hidden" id="workshop-quantity-unit"> spot</span></output>
            <button class="workshop__step" id="workshop-less" type="button" aria-label="Fewer spots" aria-controls="workshop-quantity">
              <svg viewBox="0 0 8 8" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M0 3h8v2H0z"/></svg>
            </button>
            <button class="workshop__step" id="workshop-more" type="button" aria-label="More spots" aria-controls="workshop-quantity">
              <svg viewBox="0 0 8 8" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h2v3h3v2H5v3H3V5H0V3h3z"/></svg>
            </button>
          </span>
        </dd>
      </dl>

      <!-- Only while there is something to say: "Checking spots…" or "not open yet". -->
      <p class="workshop__spots" id="workshop-spots" role="status" aria-live="polite" data-state="loading">Checking spots…</p>
      <p class="visually-hidden" id="workshop-count" role="status" aria-live="polite"></p>

      <!-- A field with something wrong gets aria-invalid and aria-describedby pointing
           at #workshop-message, which says what (workshop.js). -->
      <form class="workshop__form" id="workshop-form" novalidate>
        <label class="workshop__label" for="workshop-your-name">Your name</label>
        <input class="workshop__input" id="workshop-your-name" name="name" type="text"
               autocomplete="name" maxlength="100" required>
        <label class="workshop__label" for="workshop-email">Your email</label>
        <input class="workshop__input" id="workshop-email" name="email" type="email"
               placeholder="you@example.com" autocomplete="email" maxlength="254"
               spellcheck="false" autocapitalize="off" required>
        <label class="workshop__check">
          <input id="workshop-for-friend" type="checkbox" aria-controls="workshop-friend">
          Buying for a friend
        </label>
        <!-- Only while the box is ticked; then the friend's name is required. -->
        <div class="workshop__friend" id="workshop-friend" hidden>
          <label class="workshop__label" for="workshop-friend-name">Friend’s name</label>
          <input class="workshop__input" id="workshop-friend-name" name="friendName" type="text"
                 autocomplete="off" maxlength="100">
        </div>
        <button class="workshop__pay" id="workshop-pay" type="submit" disabled>Pay with Stripe</button>
        <p class="workshop__message" id="workshop-message" role="status" aria-live="polite"></p>
      </form>

      <p class="workshop__note" id="workshop-note">You pay on Stripe’s secure checkout page, and Stripe emails you a receipt.</p>

      <button class="workshop__pay workshop__ok" id="workshop-ok" type="button" hidden>OK</button>
    </div>
  </dialog>

  <script>
    // Style switcher (switcher.js): gives each window above the font and colour chosen
    // for it alone in Display, before first paint, from localStorage
    // ("studio414.style.<part>.font" / ".color"). A missing or invalid key means "Same
    // as everything" (no attribute). These must match PARTS in switcher.js, which sets
    // Display's own as it builds it.
    (function () {
      var parts = { mailing: '#signup', comments: '#comments-box', workshops: '#workshops, #workshop' };
      Object.keys(parts).forEach(function (part) {
        ['font', 'color'].forEach(function (kind) {
          var value;
          try { value = localStorage.getItem('studio414.style.' + part + '.' + kind); } catch (e) { value = null; }
          value = String(value).trim();
          // 20 is the number of the last option, for the font and for the colour.
          if (!/^(0|[1-9][0-9]?)$/.test(value) || Number(value) > 20) return;
          var nodes = document.querySelectorAll(parts[part]);
          for (var i = 0; i < nodes.length; i++) nodes[i].setAttribute('data-' + kind, value);
        });
      });
    })();
  </script>

  <script defer src="comments-config.js"></script>
  <script defer src="comments.js"></script>
  <script defer src="switcher.js"></script>
  <script defer src="boxes.js"></script>
  <script defer src="workshop.js"></script>
  <script defer src="calendar.js"></script>

  <script>
    // Placeholder handler until the mailing list service is connected.
    const form = document.getElementById('signup');
    const input = document.getElementById('email');
    const message = document.getElementById('signup-message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!input.checkValidity()) {
        message.textContent = 'Please enter a valid email address.';
        message.dataset.state = 'error';
        input.focus();
        return;
      }

      message.textContent = "Thanks! You're on the list.";
      message.dataset.state = 'success';
      form.reset();
    });
  </script>
</body>
</html>
