<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Studio 414 owners</title>
  <link rel="stylesheet" href="aqua.css">
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="boxes.css">
  <link rel="stylesheet" href="admin.css">
  <!-- The owners' theme and colour (look.js), before first paint. It must stay after the
       stylesheets and be loaded without defer: it writes in the theme's stylesheet. -->
  <script src="look.js"></script>
</head>
<body>
  <!--
    The owners' page (not linked from the public site). Owners sign in with Google;
    admin.js asks Supabase (is_owner(), see supabase/owners.sql) whether the account is
    an owner and then shows one of the views below. Setup: README, "Set up the owner page".
    It is Mac OS X Aqua (aqua.css, boxes.css; the page itself is admin.css): a desktop
    with the site's photo behind, a menu bar along the top, and each view below as a
    window. The gumdrops are decoration only: nothing here closes, moves or resizes.
  -->
  <header class="admin-header">
    <h1 class="admin-title"><b>Studio 414</b> — Owner</h1>
    <!-- Shown with the owner page only (admin.js). -->
    <div class="admin-account" id="admin-account" hidden>
      <p class="admin-account-text">Signed in as <strong class="admin-email" data-admin-email></strong></p>
      <button type="button" class="admin-button aqua-pill" data-admin-signout>Sign out</button>
    </div>
  </header>

  <main class="admin">
    <!-- Shown while the page loads or checks the account. -->
    <section class="admin-view admin-dialog box" id="admin-loading" aria-labelledby="admin-loading-title">
      <div class="box__titlebar">
        <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
        <h2 class="box__title" id="admin-loading-title">Studio 414</h2>
      </div>
      <div class="admin-dialog-body" aria-live="polite">
        <p class="admin-status" id="admin-loading-text">Loading…</p>
        <div class="admin-barber" aria-hidden="true"></div>
      </div>
    </section>

    <section class="admin-view admin-dialog box" id="admin-signin" aria-labelledby="admin-signin-title" hidden>
      <div class="box__titlebar">
        <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
        <h2 class="box__title" id="admin-signin-title">Sign in</h2>
      </div>
      <div class="admin-dialog-body">
        <p class="admin-dialog-lead">Sign in with your Google account to change the website.</p>
        <p class="admin-message admin-message-error" id="admin-signin-error" role="alert" hidden></p>
        <div class="admin-actions">
          <button type="button" class="admin-button admin-button-primary aqua-pill aqua-pill--tint aqua-pill--pulse admin-google" id="admin-signin-google">
            <span class="admin-google-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="14" height="14" focusable="false"><path fill="#ea4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285f4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#fbbc05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34a853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
            <span data-admin-label>Sign in with Google</span>
          </button>
        </div>
      </div>
    </section>

    <section class="admin-view admin-dialog box" id="admin-denied" aria-labelledby="admin-denied-title" hidden>
      <div class="box__titlebar">
        <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
        <h2 class="box__title" id="admin-denied-title">Not an owner</h2>
      </div>
      <div class="admin-dialog-body">
        <p class="admin-dialog-lead"><strong class="admin-email" data-admin-email></strong> isn't an owner account.</p>
        <p class="admin-hint">Sign out and sign in with an owner's Google account.</p>
        <div class="admin-actions">
          <button type="button" class="admin-button aqua-pill" data-admin-signout>Sign out</button>
        </div>
      </div>
    </section>

    <section class="admin-view admin-dialog box" id="admin-error" aria-labelledby="admin-error-title" hidden>
      <div class="box__titlebar">
        <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
        <h2 class="box__title" id="admin-error-title">Something went wrong</h2>
      </div>
      <div class="admin-dialog-body">
        <p class="admin-message admin-message-error" id="admin-error-text" role="alert"></p>
        <div class="admin-actions">
          <button type="button" class="admin-button aqua-pill" data-admin-signout>Sign out</button>
          <button type="button" class="admin-button aqua-pill" id="admin-retry">Try again</button>
        </div>
      </div>
    </section>

    <div class="admin-view" id="admin-owner" hidden>
      <!--
        Owner sections, each an Aqua window. A section module (admin-wallpaper.js,
        admin-workshops.js) calls studioAdmin.registerSection('<data-section>', render);
        see admin.js. Until one does, the section keeps its "Coming soon" placeholder.
      -->
      <section class="admin-section box" data-section="wallpaper" aria-labelledby="admin-wallpaper-title">
        <div class="box__titlebar">
          <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
          <h2 class="box__title" id="admin-wallpaper-title">Wallpaper</h2>
        </div>
        <div class="admin-section-body" data-section-body>
          <p class="admin-soon">Coming soon</p>
        </div>
      </section>

      <section class="admin-section box" data-section="workshops" aria-labelledby="admin-workshops-title">
        <div class="box__titlebar">
          <span class="box__lights" aria-hidden="true"><span class="box__light box__light--close"></span><span class="box__light box__light--min"></span><span class="box__light box__light--zoom"></span></span>
          <h2 class="box__title" id="admin-workshops-title">Workshops</h2>
        </div>
        <div class="admin-section-body" data-section-body>
          <p class="admin-soon">Coming soon</p>
        </div>
      </section>
    </div>

    <p class="admin-message admin-message-error" id="admin-signout-error" role="alert" hidden></p>
  </main>

  <script src="comments-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"
          integrity="sha384-sLWJsCmP+Z4Qn+HgF7Hi64Djta4fZMu0fcgi3uUL3GFV/ubx2G86LPOuMf7+ZIyX"
          crossorigin="anonymous"></script>
  <script src="admin.js"></script>
  <!-- Section modules go here, after admin.js. -->
  <script src="admin-wallpaper.js"></script>
  <script src="admin-workshops.js"></script>
</body>
</html>
